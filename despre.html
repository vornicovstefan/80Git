<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>GlobeTrotter - Despre Noi</title>
    <link rel="stylesheet" href="stil.css">
    <style>
        /* Fundal cafeniu solid doar pentru secțiunea de sus a acestei pagini */
        .hero-despre {
            background-color: var(--maro-inchis);
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            border-bottom: 5px solid var(--verde-masliniu);
        }

        .sectiune-echipa {
            text-align: center;
            padding: 60px 10%;
        }

        .grup-butoane {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .btn-echipa {
            background-color: var(--maro-inchis);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-echipa:hover {
            background-color: var(--verde-masliniu);
            transform: translateY(-3px);
        }

        #afisaj-descriere {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 700px;
            margin: 0 auto;
            min-height: 150px;
            border: 2px solid var(--verde-masliniu);
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: var(--maro-inchis);
        }
    </style>
</head>
<body>

<header>
    <div class="logo-section">
        <img src="imagini/foto0.png" alt="Logo GlobeTrotter" class="logo-img">
    </div>
    <nav>
        <ul>
            <li><a href="Home.html">Acasă</a></li>
            <li><a href="world-map.html">Destinații</a></li>
            <li><a href="moldova.html">Moldova</a></li>
            <li><a href="contacte.html">Contacte</a></li>
            <li><a href="despre.html">Despre Noi</a></li>
        </ul>
    </nav>
</header>

<section class="hero-despre">
    <div>
        <h1 style="font-size: 3rem; margin-bottom: 10px;">Echipa GlobeTrotter</h1>
        <p style="font-size: 1.2rem;">Pasiune pentru călătorii și profesionalism</p>
    </div>
</section>

<section class="sectiune-echipa">
    <h2 style="color: var(--maro-inchis); font-size: 2.2rem;">Cunoaște specialiștii noștri</h2>
    <p>Apasă pe butoanele de mai jos pentru a descoperi echipa din spatele proiectului.</p>

    <div class="grup-butoane">
        <button class="btn-echipa" onclick="arataMembru('manager')">Manager Proiect</button>
        <button class="btn-echipa" onclick="arataMembru('ghid')">Ghid Turistic</button>
        <button class="btn-echipa" onclick="arataMembru('suport')">Suport Clienți</button>
    </div>

    <div id="afisaj-descriere">
        <p>Așteptăm să ne cunoaștem! Selectează un profil de mai sus.</p>
    </div>
</section>

<script src="despre.js"></script>

</body>
</html>
