<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>GlobeTrotter - Destinații Populare</title>
    <link rel="stylesheet" href="stil.css">
    <style>
        .sectiune-dinamica { padding: 50px 20px; text-align: center; }
        .titlu-continent { font-size: 2.5rem; color: var(--maro-inchis); margin-bottom: 10px; text-transform: capitalize; }
        .hotel-nume { font-style: italic; font-size: 0.9rem; color: #ffcc00; margin-bottom: 10px; display: block; font-weight: bold; }
        .card-info h3 { margin-bottom: 5px; }
        .pret small { font-size: 0.6em; color: white; display: block; }
        .hero::before { background-color: #4a3423 }
        .footer-invizibil { display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo-section">
        <img src="imagini/foto0.png" alt="Logo GlobeTrotter" class="logo-img">
    </div>
    <nav>
        <ul>
            <li><a href="Home.html">Acasă</a></li>
            <li><a href="world-map.html">Destinații</a></li>
            <li><a href="moldova.html">Moldova</a></li>
            <li><a href="contacte.html">Contacte</a></li>
            <li><a href="despre.html">Despre Noi</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <h1 id="nume-continent">Destinații Populare</h1>
    <p>Cele mai bune oferte pentru vacanța ta de 7 zile</p>
</section>

<section class="sectiune-dinamica">
    <h2 class="titlu-continent" id="titlu-pagina">Informații Continent</h2>
    <p id="descriere-continent">Explorează selecția noastră de top pentru amintiri de neuitat.</p>
</section>

<section class="container-carduri" id="container-destinatii">
    </section>

<footer class="footer-verde footer-invizibil"></footer>

<div class="copyright" style="background-color: var(--maro-inchis); color: white; padding: 20px 0; text-align: center;">
    © 2026 GlobeTrotter. Toate drepturile rezervate.
</div>

<script>
     function incarcaDestinatii() {
        // alege
        const params = new URLSearchParams(window.location.search);
        const continent = params.get('continent') || 'europa';
        
       //actualizeaza txt
        document.getElementById('nume-continent').innerText = "Destinații în " + continent;
        document.getElementById('titlu-pagina').innerText = continent;

       
    
        const raspuns =  fetch('destinatii.json');
        const date =  raspuns.json();
        const listaOrase = date[continent];

        

 

        const container = document.getElementById('container-destinatii');
        container.innerHTML = ""; 

        listaOrase.forEach(d => {
            container.innerHTML += `
                <div class="card">
                    <img src="${d.img}" alt="${d.oras}">
                    <div class="card-info">
                        <h3>${d.oras}</h3>
                        <span class="hotel-nume">${d.hotel}</span>
                        <p>${d.info}</p>
                        <div class="pret">${d.pret} <small>Pachet 7 zile</small></div>
                        <a href="rezerva.html?oras=${d.oras}" class="btn-rezerva">Rezervă acum</a>
                    </div>
                </div>
            `;
        });
    }

    window.onload = incarcaDestinatii;
</script>

</body>
</html>
