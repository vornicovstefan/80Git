<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>GlobeTrotter - Autentificare</title>
    <link rel="stylesheet" href="stil.css">
    <link rel="stylesheet" href="stil-butoane.css">
    <style>
        .auth-container { 
            max-width: 400px; 
            margin: 80px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
        }
        .auth-container h2 { 
            color: var(--maro-inchis); 
            text-align: center; 
            margin-bottom: 20px; 
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        
        /* Stil pentru link-ul de sub buton */
        .auth-footer {
            text-align: center;
            margin-top: 20px;
        }
        .link-auth {
            color: var(--verde-masliniu);
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .link-auth:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-section">
        <a href="Home.html">
            <img src="imagini/foto0.png" alt="Logo" class="logo-img">
        </a>
    </div>
</header>

<div class="auth-container">
    <h2>Autentificare</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
            <label>Parolă</label>
            <input type="password" id="loginParola" required>
        </div>
        <button type="submit" class="btn-nav-auth" style="width: 100%;">Loghează-te</button>
    </form>
    
    <div class="auth-footer">
        <a href="register.html" class="link-auth">Nu ai cont? Înregistrează-te</a>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>
